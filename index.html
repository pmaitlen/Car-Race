<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Car Race Maitlen</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient( #a7d6f5 0%, #d9efff 40%, #5fa04a 41%, #5fa04a 100% );
        }

        /* ===== BUTTONS ===== */
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0 25px;
            padding: 12px 20px;
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

            .controls input[type="button"] {
                font-size: 18px;
                padding: 12px 22px;
                border-radius: 10px;
                border: none;
                background-color: #2c7be5;
                color: white;
                cursor: pointer;
            }

                .controls input[type="button"]:hover {
                    background-color: #1a5fb4;
                }

        .road, .lane, .finish-line, #car1, #car2{
            position: absolute;
            z-index: 5;
        }

        /* ===== TRACK + GRASS ===== */
        .track {
            position: relative;
            height: 540px;
            padding: 20px;
            overflow: hidden;
            background: linear-gradient( #bfe7ff 0%, #eaf7ff 40%, #5fa04a 41%, #5fa04a 100% );
        }

        .track-inner {
            position: relative;
            height: 100%;
        }

            /* subtle grass texture */
            .track::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at 20% 40%, rgba(255,255,255,0.18) 0 60px, transparent 61px), 
                    radial-gradient(circle at 70% 30%, rgba(255,255,255,0.14) 0 80px, transparent 81px), 
                    repeating-linear-gradient( 90deg, rgba(0,0,0,0.03) 0 12px, rgba(255,255,255,0.03) 12px 24px );
                opacity: 0.35;
                pointer-events: none;
                z-index: 0; 
            }

        /* ===== ROAD ===== */
        .road {
            position: absolute;
            left: 0;
            right: 0;
            top: 95px;
            height: 350px;
            border-radius: 24px;
            background: linear-gradient(#4d4f55, #3f4146);
            box-shadow: 0 10px 25px rgba(0,0,0,0.18);
        }


            .road::before,
            .road::after {
                content: "";
                position: absolute;
                left: 14px;
                right: 14px;
                height: 4px;
                background: rgba(255,255,255,0.65);
                border-radius: 999px;
            }

            .road::before {
                top: 14px;
            }

            .road::after {
                bottom: 14px;
            }

        /* ===== LANES ===== */
        .lane {
            position: absolute;
            left: 0;
            right: 0;
            height: 160px;
            border-top: 2px dashed rgba(255,255,255,0.45);
            border-bottom: 2px dashed rgba(255,255,255,0.15);
        }


            .lane.l1 {
                top: 140px;
            }

            .lane.l2 {
                top: 265px;
            }

        /* ===== FINISH LINE ===== */
        .finish-line {
            position: absolute;
            top: 95px;
            right: 60px;
            width: 25px;
            height: 350px;
            background: repeating-linear-gradient( 45deg, #000 0px, #000 10px, #fff 10px, #fff 20px );
            border-radius: 6px;
            box-shadow: 0 0 0 4px rgba(255,255,255,0.35);
        }

        /* ===== CARS ===== */
        #car1, #car2 {
            position: absolute;
            left: 1px;
            width: 190px;
            height: 120px;
            object-fit: contain;
            filter: drop-shadow(0 8px 10px rgba(0,0,0,0.25));
        }

        #car1 {
            top: 120px;
        }

        #car2 {
            top: 280px;
        }

        /* ===== WINNER EFFECT ===== */
        .winner {
            outline: 6px solid rgba(255, 215, 0, 0.85);
            border-radius: 20px;
            animation: winnerBounce 0.25s ease-in-out infinite alternate;
        }

        @keyframes winnerBounce {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-6px);
            }
        }

        /* ===== STATUS BANNER ===== */
        .status {
            position: absolute;
            /* Centered between buttons area and road: */
            top: 0px;
            left: 50%;
            transform: translateX(-50%) translateY(-100%); /* lifts banner above that line */

            width: fit-content;
            max-width: 90%;

            padding: 30px 80px;
            border-radius: 26px;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #ff0000;
            background: repeating-linear-gradient( 45deg, #000 0px, #000 12px, #fff 12px, #fff 24px );
            box-shadow: 0 16px 34px rgba(0,0,0,0.35);
            opacity: 0;
            transition: opacity 200ms ease, transform 200ms ease;
            z-index: 50;
        }

            .status.show {
                opacity: 1;
                transform: translateX(-50%) scale(1.03);
            }

            /* inner white panel behind text */
            .status::after {
                content: "";
                position: absolute;
                inset: 10px;
                border-radius: 18px;
                background: rgba(255,255,255,0.92);
                z-index: 0;
            }

            .status::before {
                content: "🏁";
                position: absolute;
                left: 22px;
                top: 50%;
                transform: translateY(-50%);
                font-size: 34px;
                z-index: 2;
            }

        /* text sits above the white panel */
        #status span {
            position: relative;
            z-index: 2;
        }


        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.95;
            z-index: 300;
            animation: fall 1.4s linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(520px) rotate(360deg);
                opacity: 0;
            }
        }

    </style>

    <script src="JavaScript.js" defer></script>
</head>

<body>
    <div class="page">
        <div class="controls">
            <input type="button" value="Start Race" onclick="StartTheRace()" />
            <input type="button" value="Pause Race" onclick="PauseTheRace()" />
            <input type="button" value="Reset Race" onclick="ResetTheRace()" />
        </div>

        <div class="track" id="track">
            <div id="status" class="status"></div>
            <div class="track-inner">
                <div class="road"></div>
                <div class="lane l1"></div>
                <div class="lane l2"></div>
                <div class="finish-line" id="finishLine"></div>
                <img id="car1" src="integra.jpg" />
                <img id="car2" src="mustang.jpg" />
            </div>
        </div>
    </div>
</body>
</html>
